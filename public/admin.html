<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard — Luxury & Elegant</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23c8a24a'>✦</text></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Framework CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            brand: '#0f3d2e',
            gold: '#c8a24a',
          },
        },
      },
    };
  </script>

  <!-- Modular Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="font-sans text-stone-800 bg-stone-100 antialiased">

  <!-- Login Modal / Screen -->
  <div id="login" class="flex min-h-screen items-center justify-center p-4">
    <form onsubmit="login(event)" class="w-full max-w-sm space-y-4 rounded-3xl bg-white p-8 shadow-xl border border-stone-200">
      <div>
        <h1 class="font-serif text-3xl font-bold text-brand">Admin Portal</h1>
        <p class="text-xs text-stone-400 mt-1">Sign in with your staff or administrator account</p>
      </div>

      <div>
        <label class="text-xs font-semibold text-stone-500 uppercase tracking-wide">Email</label>
        <input name="email" class="inp mt-1" placeholder="admin@shop.com" value="admin@shop.com" required>
      </div>

      <div>
        <label class="text-xs font-semibold text-stone-500 uppercase tracking-wide">Password</label>
        <input name="password" type="password" class="inp mt-1" placeholder="••••••••" required>
      </div>

      <button class="btn w-full !py-3 shadow-md">Sign in to Dashboard</button>
      <p id="le" class="text-xs text-rose-600 font-medium"></p>
    </form>
  </div>

  <!-- Dashboard Workspace Container -->
  <div id="dash" class="hidden min-h-screen md:flex">
    <!-- Sidebar Navigation -->
    <aside class="bg-brand p-5 text-sm md:sticky md:top-0 md:h-screen md:w-64 flex flex-col justify-between shadow-lg">
      <div>
        <div class="mb-6 px-2 flex items-center gap-2">
          <span class="text-2xl">🛍️</span>
          <div>
            <h2 class="font-serif text-lg font-bold text-white tracking-wide flex items-center gap-1.5"><span class="text-gold">✦</span> Luxury & Elegant</h2>
            <span class="text-[10px] uppercase tracking-wider text-emerald-300 font-medium">Control Panel</span>
          </div>
        </div>

        <nav id="nav" class="flex flex-wrap gap-1 md:block md:space-y-1.5"></nav>
      </div>

      <div class="border-t border-emerald-900/60 pt-4 mt-4 space-y-1">
        <a href="/" target="_blank" class="nav text-xs flex items-center justify-between">
          <span>View Public Store</span>
          <span>↗</span>
        </a>
        <button onclick="localStorage.removeItem('atok'); localStorage.removeItem('arole'); location.reload();" class="nav text-xs text-rose-300 hover:text-rose-100">
          ⎋ Log Out
        </button>
      </div>
    </aside>

    <!-- Main Workspace Content -->
    <main id="m" class="flex-1 overflow-x-hidden p-6 md:p-10"></main>
  </div>

  <!-- Dynamic Modal Dialog -->
  <dialog id="dg" class="rounded-3xl p-6 bg-white shadow-2xl"></dialog>

  <!-- Realtime Notification Toast -->
  <div id="toast" class="fixed right-6 top-6 z-50 hidden max-w-sm rounded-2xl bg-emerald-600 p-4 text-white shadow-2xl transition-all"></div>

  <!-- Admin Application Script -->
  <script src="js/admin.js"></script>
</body>
</html>
